# Host nginx server block for VAPT Scanner behind an existing nginx + certificate.
# Copy to /etc/nginx/conf.d/vapt-tool.conf, adjust server_name / certificate paths / port, then:
#   sudo nginx -t && sudo systemctl reload nginx
# VAPT's .env on that host: HTTP_BIND=127.0.0.1, HTTP_PORT=18096, TRUSTED_PROXY_CIDR=172.16.0.0/12,
# APP_URL=https://vapt-tool.prismxai.com

server {
    listen 80;
    server_name vapt-tool.prismxai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vapt-tool.prismxai.com;

    ssl_certificate     /etc/nginx/ssl/wildcard_prismxai_com.crt;   # same wildcard as the other *.prismxai.com sites
    ssl_certificate_key /etc/nginx/ssl/wildcard_prismxai_com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 110m;      # >= MAX_UPLOAD_MB (zip uploads)

    location / {
        proxy_pass http://127.0.0.1:18096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;    # PDF generation / large uploads
        proxy_request_buffering off;
    }
}
