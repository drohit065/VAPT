name: vapt

x-backend-env: &backend-env
  ADMIN_USERNAME: ${ADMIN_USERNAME}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: db
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
  MAX_EXTRACT_MB: ${MAX_EXTRACT_MB:-500}
  MAX_EXTRACT_FILES: ${MAX_EXTRACT_FILES:-20000}
  MAX_REPO_MB: ${MAX_REPO_MB:-1000}
  SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-1800}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  APP_URL: ${APP_URL:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    # The worker gets only what it needs: no admin password or JWT secret.
    environment:
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      MAX_EXTRACT_MB: ${MAX_EXTRACT_MB:-500}
      MAX_EXTRACT_FILES: ${MAX_EXTRACT_FILES:-20000}
      MAX_REPO_MB: ${MAX_REPO_MB:-1000}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-3600}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ZAP_URL: http://zap:8090
      APP_URL: ${APP_URL:-}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
    volumes:
      - uploads:/data/uploads
      - scanner-cache:/cache
    tmpfs:
      - /tmp
    networks: [default, scan]
    depends_on:
      db:
        condition: service_healthy

  # OWASP ZAP daemon for live URL scans. Only the worker can reach it (separate 'scan' network,
  # no published port), and ZAP itself cannot reach the database.
  zap:
    image: zaproxy/zap-stable:20261026
    restart: unless-stopped
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8090"
      - -config
      - api.key=${ZAP_API_KEY:-}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - connection.timeoutInSecs=30
    # The image's own health check probes a different port; check the daemon we actually run.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8090/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks: [scan]

  # Nightly database backup at 02:30 UTC into ./backups (gzip, BACKUP_KEEP_DAYS retention, default 14).
  # Restore (README): gunzip -c backups/vapt-DATE.sql.gz | docker compose exec -T db psql -U <user> -d <db>
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date -u +%s)
          target=$$(( now - now % 86400 + 9000 ))
          [ "$$target" -le "$$now" ] && target=$$(( target + 86400 ))
          sleep $$(( target - now ))
          f=/backups/vapt-$$(date -u +%Y-%m-%d).sql.gz
          if pg_dump --no-owner --clean --if-exists | gzip > "$$f.tmp"; then
            mv "$$f.tmp" "$$f"; echo "backup written: $$f"
          else
            rm -f "$$f.tmp"; echo "backup FAILED"
          fi
          find /backups -name 'vapt-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
        done
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  scanner-cache:

networks:
  default:
  scan:
